<!--
STEAM-STYLE GAME PORTFOLIO (PLAIN HTML / CSS / JS)
Single-file version for easy local testing
Open this file directly in a browser or via a local server
-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JsCbrt Game Portfolio</title>

  <!-- Steam-like font -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #1b2838;
      --bg-panel: #2a475e;
      --bg-card: #16202d;
      --text-main: #c7d5e0;
      --text-muted: #8f98a0;
      --accent: #66c0f4;
      --accent-hover: #a4d7f5;
      --border: #316282;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
    }

    body {
      background: linear-gradient(180deg, #1b2838 0%, #171a21 100%);
      color: var(--text-main);
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      color: var(--accent-hover);
    }

    header {
      background: #171a21;
      padding: 14px 32px;
      border-bottom: 1px solid #000;
    }

    header h1 {
      font-size: 20px;
      font-weight: 500;
    }

    .container {
      max-width: 1200px;
      margin: 32px auto;
      padding: 0 16px;
    }

    /* STORE GRID */
    .store-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .status-badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 6px;
      margin-bottom: 6px;
      border-radius: 2px;
      background: #4c6b22;
      color: #d2efa9;
      position: relative;
      cursor: default;
    }


    .status-badge.dev {
      background: #6b3e22;
      color: #f0c9a9;
    }


    .status-badge .tooltip {
      visibility: hidden;
      opacity: 0;
      position: absolute;
      bottom: 125%;
      left: 50%;
      transform: translateX(-50%);
      background: #000;
      color: #c7d5e0;
      padding: 6px 8px;
      font-size: 11px;
      white-space: nowrap;
      border: 1px solid #316282;
      transition: opacity 0.15s ease;
      z-index: 10;
    }


    .status-badge:hover .tooltip {
      visibility: visible;
      opacity: 1;
    }


    .status-badge.dev {
      background: #6b3e22;
      color: #f0c9a9;
    }

    .game-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .game-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .game-card img {
      width: 100%;
      display: block;
    }

    .game-card-content {
      padding: 12px;
    }

    .game-card h2 {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .game-card p {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* GAME PAGE */
    .game-page {
      display: none;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
    }

    .screenshots img {
      width: 100%;
      margin-bottom: 12px;
      border: 1px solid #000;
    }

    .sidebar {
      background: var(--bg-panel);
      padding: 16px;
      border: 1px solid var(--border);
    }

    .sidebar h3 {
      font-size: 14px;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .sidebar ul {
      list-style: none;
      font-size: 13px;
      color: var(--text-muted);
    }

    .sidebar ul li::before {
      content: "• ";
      color: var(--accent);
    }

    .steam-button {
      display: block;
      margin-top: 16px;
      padding: 10px;
      background: linear-gradient(90deg, #75b022, #588a1b);
      color: #fff;
      text-align: center;
      font-weight: 500;
    }

    .steam-button:hover {
      filter: brightness(1.1);
    }

    .back-link {
      margin-bottom: 16px;
      display: inline-block;
      font-size: 13px;
    }

    /* CAROUSEL */
    .carousel {
      position: relative;
    }

    .carousel-image {
      width: 100%;
      border: 1px solid #000;
      transition: opacity 0.3s ease;
    }

    .carousel-image.fade-out {
      opacity: 0;
    }

    .thumbnails {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      overflow-x: auto;
    }

    .thumbnails img {
      height: 60px;
      cursor: pointer;
      border: 2px solid transparent;
      opacity: 0.6;
    }

    .thumbnails img.active {
      border-color: var(--accent);
      opacity: 1;
    }

    .thumbnails img:hover {
      opacity: 1;
    }

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.6);
      color: #c7d5e0;
      border: none;
      font-size: 22px;
      padding: 6px 10px;
      cursor: pointer;
    }

    .carousel-btn:hover {
      background: rgba(0,0,0,0.8);
    }

    .carousel-btn.left { left: 6px; }
    .carousel-btn.right { right: 6px; }

    @media (max-width: 900px) {
      .game-page {
        grid-template-columns: 1fr;
      }
    }

    /* FOOTER */
    footer {
      background: #171a21;
      border-top: 1px solid #000;
      padding: 18px 32px;
      margin-top: 48px;
    }


    .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }


    .footer-name {
      font-size: 13px;
      color: var(--text-muted);
    }


    .footer-links {
      display: flex;
      gap: 14px;
    }


    .footer-links a {
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #0f141b;
      border: 1px solid #000;
      border-radius: 2px;
    }


    .footer-links a:hover {
      background: #2a475e;
    }


    .footer-links svg {
      width: 18px;
      height: 18px;
      fill: var(--text-main);
    }


    @media (max-width: 600px) {
      .footer-inner {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>JsCbrt Game Portfolio</h1>
</header>

<div class="container">

  <!-- STORE PAGE -->
  <div id="store" class="store-grid"></div>

  <!-- GAME PAGE -->
  <div id="gamePage" class="game-page">
    <div>
      <a href="#" class="back-link" onclick="goBack()">← Back to Store</a>
      <h2 id="gameTitle"></h2>
      <div class="carousel">
        <button class="carousel-btn left" onclick="prevShot()">❮</button>
        <img id="carouselImage" class="carousel-image" />
        <button class="carousel-btn right" onclick="nextShot()">❯</button>
      </div>
      <div class="thumbnails" id="thumbnails"></div>
    </div>

    <div class="sidebar">
      <span id="gameStatus" class="status-badge"></span>
      <p id="gameDescription"></p>

      <h3>Features</h3>
      <ul id="features"></ul>

      <h3>Controls</h3>
      <ul id="controls"></ul>

      <a id="steamLink" class="steam-button" target="_blank">View on Steam</a>
    </div>
  </div>

</div>

<script>
  const games = [
    {
      title: "Sjoelbak - Dutch Shuffleboard",
      status: "Completed",
      progress: 100,
      shortDescription: "A faithful recreation of the Dutch classic",
      description: "Sitting in public transport, waiting for a meeting or perhaps you just want to take a little time to yourself? This game is for you! <br><br> This arcade recreation of the popular dutch game Sjoelbak, or commonly known as dutch shuffleboard will bring you quick and easy fun in a moment's notice! <br><br> Offering easily accessible gameplay that simulates the real world feel of play, it is simple to use and appealing to both newcomers and real life experts alike! <br><br> Reach for the highscore, unlock new skins as you progress, or simply pass some time, it's always a great time to play a few quick games!",
      features: ["Single-player", "Mobile Game", "Leaderboard", "Highscore"],
      controls: ["Swipe Up – Throw", "Pull To Side – Aim"],
      steamLink: "https://play.google.com/store/apps/details?id=com.JsCbrt.Sjoelbak&hl=en-us",
      screenshots: [
        "sjoelbak.jpg",
        //"https://via.placeholder.com/800x450"
      ]
    },
    {
      title: "360 Arena",
      status: "Completed",
      progress: 100,
      shortDescription: "A fast-paced arena shooter with changing gravity",
      description: "This is a 2 player arena local multiplayer game where the players battle in a gravity-changing arena.",
      features: ["Local Multiplayer", "Changing Gravity", "Multiple Levels", "Shooter"],
      controls: ["WASD – Move P1", "LShift – Shoot P1", "C – Jump P1", ],
      steamLink: "https://jscbrt.itch.io/360-arena",
      screenshots: [
        "360-arena.png",
        //"https://via.placeholder.com/800x450"
      ]
    },
    {
      title: "The Floor Is Lava",
      status: "Completed",
      progress: 100,
      shortDescription: "A fast-paced platforming game",
      description: "In this game, you play as a kid playing in his backyard as the floor becomes lava at an increasingly fast pace. Every round, objects will randomly spawn inside the terrain to be able to jump away from danger. <br><br>The goal is to survive as many rounds as possible which can be compared to other players through the online leaderboard.",
      features: ["Single-player", "Highscore", "Leaderboard"],
      controls: ["WASD – Move", "Mouse – Aim", "Space – Jump"],
      steamLink: "https://jscbrt.itch.io/the-floor-is-lava",
      screenshots: [
        "tfil.png",
        "tfil2.png",
        "tfil3.png",
        "tfil4.png",
      ]
    },
    {
      title: "Dungeon Survival",
      status: "Completed",
      progress: 100,
      shortDescription: "A fast-paced tower-defense & survival hybrid",
      description: "This is a game about a knight getting lost in a dungeon and getting trapped inside of a room with endless zombies coming through the gate. <br><br>The player's goal is to survive and protect the torches lighting up the room.",
      features: ["Single-player", "Controller Support", "Multiple Levels"],
      controls: ["WASD – Move", "Mouse – Aim", "LMB - Shoot"],
      steamLink: "https://jscbrt.itch.io/dungeon-survival",
      screenshots: [
        "dungeonS.png",
        "dungeonS2.png",
        "dungeonS3.png",
        "dungeonS4.png",
      ]
    },
    {
      title: "Elemals",
      status: "In Development",
      progress: 8,
      shortDescription: "An RPG about Elemental Animals",
      description: "This is a game where you capture and train Elemental Animals on your journey to restore the Elements of the land!",
      features: ["RPG", "Controller Support", "Creature Collection", "Turn-Based Combat"],
      controls: ["WASD/LS/Dpad – Move/Select", "Enter/A – Select", "BackSpace/B – Cancel"],
      steamLink: "",
      screenshots: [
        //"https://via.placeholder.com/800x450",
       // "https://via.placeholder.com/800x450"
      ]
    }
  ];

  const store = document.getElementById('store');
  const carouselImage = document.getElementById('carouselImage');
  let currentGame = null;
  let currentShot = 0;
  const gamePage = document.getElementById('gamePage');

  function loadStore() {
    store.innerHTML = '';
    store.style.display = 'grid';
    gamePage.style.display = 'none';

    games.forEach((game, index) => {
      const card = document.createElement('div');
      card.className = 'game-card';
      card.onclick = () => openGame(index);

      card.innerHTML = `
        <img src="${game.screenshots[0]}" />
        <div class="game-card-content">
          <span class="status-badge ${game.status === 'Completed' ? '' : 'dev'}">${game.status} (${game.progress}%)</span>
          <h2>${game.title}</h2>
          <p>${game.shortDescription}</p>
        </div>
      `;

      store.appendChild(card);
    });
  }

  function openGame(index) {
    const game = games[index];

    store.style.display = 'none';
    gamePage.style.display = 'grid';

    document.getElementById('gameTitle').textContent = game.title;
    document.getElementById('gameDescription').innerHTML = game.description;

    const statusEl = document.getElementById('gameStatus');
    statusEl.innerHTML = `${game.status} (${game.progress}%)<span class='tooltip'>${game.status === 'Completed' ? 'This project is finished and no longer in development' : 'This project is still in active development'}</span>`;
    statusEl.className = `status-badge ${game.status === 'Completed' ? '' : 'dev'}`;

    currentGame = game;
    currentShot = 0;
    carouselImage.src = game.screenshots[0];

    const thumbs = document.getElementById('thumbnails');
    thumbs.innerHTML = game.screenshots.map((s, i) =>
      `<img src="${s}" class="${i === 0 ? 'active' : ''}" onclick="jumpToShot(${i})">`
    ).join('');

    document.getElementById('features').innerHTML = game.features
      .map(f => `<li>${f}</li>`).join('');

    document.getElementById('controls').innerHTML = game.controls
      .map(c => `<li>${c}</li>`).join('');

    if (game.steamLink != "") document.getElementById('steamLink').href = game.steamLink;
    else {
      document.getElementById('steamLink').innerText = "No Store Link";
      document.getElementById('steamLink').onclick = NoStoreLink;
    }
  }

  function NoStoreLink(){
    alert("This game is still in development!");
    return false;
  }

  function changeShot(newIndex) {
    carouselImage.classList.add('fade-out');

    setTimeout(() => {
      currentShot = newIndex;
      carouselImage.src = currentGame.screenshots[currentShot];

      document.querySelectorAll('.thumbnails img').forEach((img, i) => {
        img.classList.toggle('active', i === currentShot);
      });

      carouselImage.classList.remove('fade-out');
    }, 150);
  }

  function nextShot() {
    if (!currentGame) return;
    changeShot((currentShot + 1) % currentGame.screenshots.length);
  }

  function prevShot() {
    if (!currentGame) return;
    changeShot((currentShot - 1 + currentGame.screenshots.length) % currentGame.screenshots.length);
  }

  function jumpToShot(index) {
    if (!currentGame || index === currentShot) return;
    changeShot(index);
  }

  function prevShot() {
    if (!currentGame) return;
    currentShot = (currentShot - 1 + currentGame.screenshots.length) % currentGame.screenshots.length;
    carouselImage.src = currentGame.screenshots[currentShot];
  }

  function goBack() {
    loadStore();
  }

  loadStore();
</script>

<footer>
<div class="footer-inner">
<div class="footer-name">© <span id="footerName">JsCbrt</span></div>

</a>

  </a>

<a href="https://github.com/JsCbrt" target="_blank" title="GitHub">
  <img src="github.svg" width="20px">
</a>


<!-- LinkedIn -->
<a href="https://www.linkedin.com/in/jason-cabart-2b8305212" target="_blank" title="LinkedIn">
  <img src="linkedin.svg" width="20px">
</a>
</div>
</div>
</footer>

</body>
</html>
